name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wiki structure lint (deterministic merge authority)
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/lint_dag.py --ci
      - name: Linter unit tests
        env:
          PYTHONIOENCODING: utf-8
        run: python -m unittest discover -s tests -v